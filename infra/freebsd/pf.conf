# PHANTOM AI - pf.conf del firewall perimetral de laboratorio (FreeBSD).
#
# El firewall es la puerta de entrada de la aplicacion:
#   cliente -> FreeBSD :80/:443 --rdr--> host del cluster :30080 (entrada k3d) -> Service Web
# Estado inicial DELIBERADO: el puerto de prueba 8081 esta abierto sin necesidad.
# PHANTOM solo modifica el anchor "phantom"; el resto del ruleset es fijo.

ext_if = "em0"
app_host = "172.16.97.1"      # host Linux donde corre k3d (red vmnet8)
app_port = "30080"            # NodePort del Service Web
allowed_tcp = "{ 22, 80, 443 }"
test_tcp = "{ 8081 }"

set skip on lo0
set block-policy return
set loginterface $ext_if

scrub in all

# Reenvio de la aplicacion. El nat hace que la respuesta vuelva por el firewall.
nat on $ext_if proto tcp from any to $app_host port $app_port -> ($ext_if)
rdr pass on $ext_if proto tcp from any to ($ext_if) port { 80, 443 } -> $app_host port $app_port

# Reglas gestionadas por PHANTOM (evaluadas primero; usan "quick").
anchor "phantom"

block log all
pass out quick keep state
pass in quick inet proto icmp all
pass in log quick proto tcp to port $allowed_tcp keep state
pass in log quick proto tcp to port $test_tcp keep state
